name: deploy

# Publicação manual e segura: só roda quando alguém clica em "Run workflow".
# Os dados de acesso ficam nos Secrets do GitHub (DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY), nunca aqui.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:v2
          extensions: pdo_mysql, zip, gd, intl, mbstring

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - run: npm ci
      - run: npm run build

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Send files (without .env, storage or git)
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='.env' --exclude='storage' --exclude='node_modules' --exclude='tests' --exclude='.spec' \
            -e "ssh -i ~/.ssh/id_deploy" ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Migrate and refresh caches
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${{ secrets.DEPLOY_PATH }} && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan queue:restart"

name: tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: nossa_financas_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:v2
          extensions: pdo_mysql, pdo_sqlite, zip, gd, intl, mbstring

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npm run build
      - run: ./vendor/bin/pint --test
      - name: Pest (MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nossa_financas_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: ./vendor/bin/pest
